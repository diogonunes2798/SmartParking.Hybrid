# Scrapes the API and the Workers running on the host (dotnet run), see launchSettings.json.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: smartparking-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5080"]

  - job_name: smartparking-workers
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5090"]
