# Local infrastructure for the SmartParking.Hybrid prototype.
# Images are pinned to an exact patch version AND content digest so that experiments are reproducible
# (CLAUDE.md, reproducibility rule). Update them deliberately and record it in docs/DIARIO.md.
#
#   docker compose up -d                          # PostgreSQL, MongoDB, Redis
#   docker compose --profile observability up -d  # + Prometheus (http://localhost:9090)
#                                                 #   + Jaeger (traces, http://localhost:16686; OTLP on 4317/4318)
#
# Messaging (D2, default "PostgreSQL outbox + Redis Streams") needs no extra broker container.
# Credentials are development-only defaults; override them in a local .env (see .env.example).

name: smartparking-hybrid

services:
  postgres:
    # PostgreSQL 16.15 + PostGIS 3.5.7 (Phase 8, ADR-0012): the monolithic variant answers UC-03 with PostGIS. The same
    # image serves both variants, so the comparison of Cap. 6.5 runs on the same engine build.
    image: postgis/postgis:16-3.5-alpine@sha256:47e961a569fd52ff31f0fe205ed91eeab17d9f5fff6722e6d7ea6b588748b293
    # The image's init script would create postgis, topology and tiger in «public»; the migration AddMonolithicSchema
    # creates only postgis, in its own schema. An empty tmpfs hides the script (it runs only on a new data volume).
    tmpfs:
      - /docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartparking}
      POSTGRES_USER: ${POSTGRES_USER:-smartparking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartparking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7.0.48@sha256:9896df581dfd0718b7abe112f4c37598d0986c54060e4ec1384997e6503c8c71
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-smartparking}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-smartparking}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # AOF persistence so that the read model survives a container restart (RNF-03 scenario).
    # noeviction stated explicitly (it is also Redis' default): an evicted read model key would make the counters
    # drift silently, and an evicted stream would lose events. With a memory limit, writes fail loudly instead
    # (ADR-0008; review of Phase 4, cache finding 6).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Traces (Phase 5, ADR-0009): the API and the Workers export to it only when OTEL_EXPORTER_OTLP_ENDPOINT is set
  # (e.g. http://localhost:4317). In-memory storage: traces are for inspection, the measurements are the metrics.
  jaeger:
    image: jaegertracing/jaeger:2.11.0@sha256:b585df1b6299bbbd16bf7c679da30389349736e4b6bc8f4f500142a75bf26ca8
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  prometheus-data:
